
# ============================================================
# GitLab CI/CD - Terraform Infrastructure
# ============================================================

stages:
  - prepare
  - secret-detection
  - validate
  - deploy
  - release

# ============================================================
# Shared CI Templates
# ============================================================

include:
  - project: 'tech1212145/ci-templates'
    ref: master
    file:
      - '/templates/version.yml'

# ============================================================
# Pipeline Configuration
# ============================================================

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: always

# ============================================================
# Shared Terraform Configuration
# ============================================================

.terraform:
  image:
    name: hashicorp/terraform:1.11
    entrypoint: [""]

  variables:
    AWS_DEFAULT_REGION: ca-central-1

# ============================================================
# Terraform Validation
# ============================================================

terraform-validate:
  extends: .terraform
  stage: validate

  script:
    - terraform fmt -check -recursive
    - |
      set -e

      for dir in envs/*; do
        echo "Validating ${dir}"
        (
          cd "$dir"
          terraform init -backend=false
          terraform validate
        )
      done

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ============================================================
# Terraform Plan
# ============================================================

terraform-plan-dev:
  extends: .terraform
  stage: validate

  script:
    - cd envs/dev
    - terraform init
    - terraform plan -input=false -out=tfplan

  artifacts:
    paths:
      - envs/dev/tfplan
    expire_in: 1 week

  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

terraform-plan-prod:
  extends: .terraform
  stage: validate

  script:
    - cd envs/prod
    - terraform init
    - terraform plan -input=false -out=tfplan

  artifacts:
    paths:
      - envs/prod/tfplan
    expire_in: 1 week

  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'

# ============================================================
# Terraform Apply
# ============================================================

terraform-apply-dev:
  extends: .terraform
  stage: deploy

  script:
    - cd envs/dev
    - terraform init
    - terraform apply -input=false -auto-approve tfplan

  dependencies:
    - terraform-plan-dev

  environment:
    name: dev

  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

terraform-apply-prod:
  extends: .terraform
  stage: deploy

  script:
    - cd envs/prod
    - terraform init
    - terraform apply -input=false -auto-approve tfplan

  dependencies:
    - terraform-plan-prod

  environment:
    name: prod

  when: manual

  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'

# ============================================================
# Semantic Version Calculation
# ============================================================

version-calculate-dev:
  extends: .version:calculate

  variables:
    VERSION_PREFIX: "dev-"

  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

version-calculate-prod:
  extends: .version:calculate

  variables:
    VERSION_PREFIX: "prod-"

  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'

# ============================================================
# Git Tag Creation
# ============================================================

version-tag-dev:
  extends: .version:tag

  needs:
    - job: version-calculate-dev
      artifacts: true
    - job: terraform-apply-dev
      artifacts: false

  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

version-tag-prod:
  extends: .version:tag

  needs:
    - job: version-calculate-prod
      artifacts: true
    - job: terraform-apply-prod
      artifacts: false

  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
