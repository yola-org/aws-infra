stages:
  - prepare            # new, for calculate-version
  - secret-detection
  - validate
  - deploy
  - release

include:
  - project: 'tech1212145/ci-templates'
    ref: master
    file:
      - '/templates/version.yml'
      - '/templates/git-tag.yml'

workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always

terraform:validate:
  stage: validate
  image:
    name: hashicorp/terraform:1.11
    entrypoint: [""]
  script:
    - terraform fmt -check -recursive
    - |
      set -e
      for dir in envs/*; do
        echo "== validating $dir"
        (cd "$dir" && terraform init -backend=false && terraform validate)
      done
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

.terraform_base: &terraform_base
  image:
    name: hashicorp/terraform:1.11
    entrypoint: [""]
  before_script:
    - export AWS_DEFAULT_REGION=ca-central-1

terraform:dev:plan:
  <<: *terraform_base
  stage: validate
  script:
    - cd envs/dev
    - terraform init
    - terraform plan -input=false -out=tfplan
  artifacts:
    paths:
      - envs/dev/tfplan
    expire_in: 1 week
  rules:
    # Protected variables only exist on protected branches (dev/prod).
    - if: $CI_COMMIT_BRANCH == "dev"

terraform:prod:plan:
  <<: *terraform_base
  stage: validate
  script:
    - cd envs/prod
    - terraform init
    - terraform plan -input=false -out=tfplan
  artifacts:
    paths:
      - envs/prod/tfplan
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"

terraform:dev:apply:
  <<: *terraform_base
  stage: deploy
  script:
    - cd envs/dev
    - terraform init
    - terraform apply -input=false -auto-approve tfplan
  dependencies:
    - terraform:dev:plan
  environment:
    name: dev
  # Applies automatically once the MR is merged into `dev`.
  # Change to `when: manual` to require a button click.
  when: on_success
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

terraform:prod:apply:
  <<: *terraform_base
  stage: deploy
  script:
    - cd envs/prod
    - terraform init
    - terraform apply -input=false -auto-approve tfplan
  dependencies:
    - terraform:prod:plan
  environment:
    name: prod
  # Manual even after merge — protect the `prod` environment in GitLab
  # (Settings > CI/CD > Protected environments) to restrict who can click it.
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"

calculate-version:
  extends: .version


git-tag-dev:
  extends: .git-tag
  stage: release
  variables:
    GIT_TAG_PREFIX: "dev-"
  needs:
    - job: calculate-version
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

git-tag:
  extends: .git-tag
  stage: release
  needs:
    - job: calculate-version
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"