
# ============================================================
# GitLab CI/CD - Terraform Infrastructure
# ============================================================

stages:
  - secret-detection
  - validate
  - deploy
  - -release

variables:
  # Run Secret Detection in MR pipelines as well as branch pipelines.
  AST_ENABLE_MR_PIPELINES: "true"

# ============================================================
# Shared CI Templates
# ============================================================

include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - project: 'tech1212145/ci-templates'
    ref: master
    file:
      - '/templates/version.yml'

# ============================================================
# Pipeline Configuration
# ============================================================

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Deployment branches always run so plan/apply is never skipped.
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "prod"'
    # Other branches: avoid a duplicate pipeline when an MR is already open.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

# The GitLab Secret-Detection job defaults to the `test` stage; this repo uses
# a dedicated stage instead. `needs: []` starts the scan immediately.
secret_detection:
  stage: secret-detection
  needs: []

# This repo defines its own per-environment version jobs below. Disable the
# template's default-branch job so it does not run on `main` for nothing.
version:calculate:
  rules:
    - when: never

# ============================================================
# Shared Terraform Configuration
# ============================================================

.terraform:
  image:
    name: hashicorp/terraform:1.11
    entrypoint: [""]

  variables:
    AWS_DEFAULT_REGION: ca-central-1
    TF_IN_AUTOMATION: "true"
    TF_PLUGIN_CACHE_DIR: "$CI_PROJECT_DIR/.terraform.d/plugin-cache"

  # Providers are reused across pipelines; state/modules are not cached.
  cache:
    key: "terraform-$CI_PROJECT_NAME"
    paths:
      - .terraform.d/plugin-cache

  before_script:
    - mkdir -p "$TF_PLUGIN_CACHE_DIR"

# ============================================================
# Terraform Validation
# ============================================================

terraform-validate:
  extends: .terraform
  stage: validate
  interruptible: true
  needs: []

  script:
    - terraform fmt -check -recursive
    - |
      set -e

      for dir in envs/*; do
        echo "Validating ${dir}"
        (
          cd "$dir"
          terraform init -backend=false
          terraform validate
        )
      done

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ============================================================
# Terraform Plan
# ============================================================

terraform-plan-dev:
  extends: .terraform
  stage: validate
  interruptible: true
  needs: []

  script:
    - cd envs/dev
    - terraform init
    - terraform plan -input=false -out=tfplan

  artifacts:
    paths:
      - envs/dev/tfplan
    expire_in: 1 week

  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

terraform-plan-prod:
  extends: .terraform
  stage: validate
  interruptible: true
  needs: []

  script:
    - cd envs/prod
    - terraform init
    - terraform plan -input=false -out=tfplan

  artifacts:
    paths:
      - envs/prod/tfplan
    expire_in: 1 week

  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'

# ============================================================
# Terraform Apply
# ============================================================

terraform-apply-dev:
  extends: .terraform
  stage: deploy
  # Never run two applies against the same environment at once.
  resource_group: terraform-apply-dev

  script:
    - cd envs/dev
    - terraform init
    - terraform apply -input=false -auto-approve tfplan

  dependencies:
    - terraform-plan-dev

  environment:
    name: dev

  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

terraform-apply-prod:
  extends: .terraform
  stage: deploy
  # Never run two applies against the same environment at once.
  resource_group: terraform-apply-prod

  script:
    - cd envs/prod
    - terraform init
    - terraform apply -input=false -auto-approve tfplan

  dependencies:
    - terraform-plan-prod

  environment:
    name: prod

  when: manual

  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'

# ============================================================
# Semantic Version Calculation
# ============================================================

version-calculate-dev:
  extends: .version:calculate

  variables:
    VERSION_PREFIX: "dev-"

  rules:
    - if: '$VERSION_SKIP == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "dev"'

version-calculate-prod:
  extends: .version:calculate

  variables:
    VERSION_PREFIX: "prod-"

  rules:
    - if: '$VERSION_SKIP == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "prod"'

# ============================================================
# Git Tag Creation
# ============================================================

version-tag-dev:
  extends: .version:tag

  needs:
    - job: version-calculate-dev
      artifacts: true
    - job: terraform-apply-dev
      artifacts: false

  rules:
    - if: '$VERSION_SKIP == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - '**/*.tf'
        - '**/*.tfvars'

version-tag-prod:
  extends: .version:tag

  needs:
    - job: version-calculate-prod
      artifacts: true
    - job: terraform-apply-prod
      artifacts: false

  rules:
    - if: '$VERSION_SKIP == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "prod"'
      changes:
        - '**/*.tf'
        - '**/*.tfvars'
