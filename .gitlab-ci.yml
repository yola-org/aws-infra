
# ============================================================
# GitLab CI/CD - Terraform Infrastructure
# ============================================================

stages:
  - prepare
  - secret-detection
  - validate
  - deploy
  - release

# ============================================================
# Shared CI Templates
# ============================================================

include:
  - project: 'tech1212145/ci-templates'
    ref: master
    file:
      - '/templates/version.yml'

# ============================================================
# Workflow
# ============================================================

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: always

# ============================================================
# Terraform Validation
# ============================================================

terraform:validate:
  stage: validate
  image:
    name: hashicorp/terraform:1.11
    entrypoint: [""]
  script:
    - terraform fmt -check -recursive
    - |
      set -e

      for dir in envs/*; do
        echo "== validating $dir"
        (cd "$dir" && terraform init -backend=false && terraform validate)
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: $CI_COMMIT_BRANCH

# ============================================================
# Terraform Base
# ============================================================

.terraform_base: &terraform_base
  image:
    name: hashicorp/terraform:1.11
    entrypoint: [""]
  before_script:
    - export AWS_DEFAULT_REGION=ca-central-1

# ============================================================
# DEV - Terraform Plan
# ============================================================

terraform:dev:plan:
  <<: *terraform_base
  stage: validate
  script:
    - cd envs/dev
    - terraform init
    - terraform plan -input=false -out=tfplan
  artifacts:
    paths:
      - envs/dev/tfplan
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================================
# PROD - Terraform Plan
# ============================================================

terraform:prod:plan:
  <<: *terraform_base
  stage: validate
  script:
    - cd envs/prod
    - terraform init
    - terraform plan -input=false -out=tfplan
  artifacts:
    paths:
      - envs/prod/tfplan
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"

# ============================================================
# DEV - Terraform Apply
# ============================================================

terraform:dev:apply:
  <<: *terraform_base
  stage: deploy
  script:
    - cd envs/dev
    - terraform init
    - terraform apply -input=false -auto-approve tfplan
  dependencies:
    - terraform:dev:plan
  environment:
    name: dev
  when: on_success
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================================
# PROD - Terraform Apply
# ============================================================

terraform:prod:apply:
  <<: *terraform_base
  stage: deploy
  script:
    - cd envs/prod
    - terraform init
    - terraform apply -input=false -auto-approve tfplan
  dependencies:
    - terraform:prod:plan
  environment:
    name: prod
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"

# ============================================================
# DEV - Version Calculation
# ============================================================

version:calculate:dev:
  extends: .version:calculate
  variables:
    VERSION_PREFIX: "dev-"
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================================
# PROD - Version Calculation
# ============================================================

version:calculate:prod:
  extends: .version:calculate
  variables:
    VERSION_PREFIX: "prod-"
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"

# ============================================================
# DEV - Git Tag Creation
# ============================================================

version:tag:dev:
  extends: .version:tag
  needs:
    - job: version:calculate:dev
      artifacts: true
    - job: terraform:dev:apply
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================================
# PROD - Git Tag Creation
# ============================================================

version:tag:prod:
  extends: .version:tag
  needs:
    - job: version:calculate:prod
      artifacts: true
    - job: terraform:prod:apply
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
